<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a0d14">
<title>Rocola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: rocola de bar, cálida y festiva, pero clara para usar con una mano.
   IDEA: la consola de una rocola: selector arriba, lista iluminada, botonera abajo.
   PICTURE: la lista de espera y la letra del karaoke son la imagen principal.
   COLOUR+TYPE: vino profundo, rosa neón como acento, crema cromada; Bungee + Inter.
   LAYOUT: una columna en el celular; dos columnas (búsqueda | lista) en la PC. */
:root{--bg:#1a0d14;--panel:#26131d;--line:#43243a;--ink:#f6ebdf;--mute:#c8aebb;--acc:#ff4f7b;--acc2:#ffc857;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:12px;min-height:44px;padding:0 16px;background:var(--line);font-weight:600}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
button.pri{background:var(--acc);color:#1a0d14}
button.ghost{background:transparent;border:1px solid var(--line)}
button.icon{width:44px;padding:0;font-size:20px}
input,select{min-height:48px;border-radius:12px;border:1px solid var(--line);background:#120910;padding:0 14px;font-size:16px;width:100%}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px max(4vw,14px);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font:400 28px/1 Bungee,sans-serif;margin:0;color:var(--acc);letter-spacing:.5px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
nav a{color:var(--mute);text-decoration:none;padding:10px 14px;border-radius:999px;font-weight:600}
nav a.on{background:var(--acc);color:#1a0d14}
main{max-width:1240px;margin:0 auto;padding:18px max(4vw,14px)}
.grid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
h2{font:800 20px/1.2 Inter,sans-serif;margin:0 0 12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.modes button{min-height:38px;border-radius:999px;background:transparent;border:1px solid var(--line);font-size:14px}
.modes button.on{background:var(--acc2);color:#1a0d14;border-color:var(--acc2)}
ul.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item img,.ph{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--line)}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a{color:var(--mute);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.now{background:linear-gradient(90deg,rgba(255,79,123,.18),transparent);border-radius:10px}
.item.done{opacity:.45}
.pick{cursor:pointer;border-radius:8px}.pick:hover .t{color:var(--acc)}
.acts{display:flex;gap:4px}
.acts button{min-height:40px;width:40px;padding:0;font-size:16px}
.muted{color:var(--mute);font-size:14px}
.player{position:fixed;left:0;right:0;bottom:0;background:#0f070c;border-top:1px solid var(--line);padding:10px max(4vw,14px) calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;z-index:6}
.player .bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.player .bar i{display:block;height:100%;width:0;background:var(--acc)}
.player select{min-height:38px;font-size:14px;max-width:220px}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:var(--acc2);color:#1a0d14;padding:10px 16px;border-radius:12px;font-weight:600;display:none;z-index:9;max-width:90vw}
.setup{max-width:640px;margin:0 auto}
.setup ol{padding-left:20px}.setup li{margin:8px 0}
code{background:#120910;padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
/* Karaoke */
#karaoke{position:fixed;inset:0;background:radial-gradient(circle at 50% 0,#3a1229,#0b0508 70%);z-index:20;display:none;flex-direction:column}
#karaoke.show{display:flex}
.kh{display:flex;gap:10px;align-items:center;padding:14px 20px;flex-wrap:wrap}
.kh .t{font-size:20px}
.kh .ctr{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
#lyr{flex:1;overflow-y:auto;padding:30vh 6vw;text-align:center;scrollbar-width:none}
#lyr p{margin:0;padding:10px 0;font-weight:800;font-size:clamp(24px,4.2vw,56px);line-height:1.2;color:rgba(246,235,223,.32);transition:color .25s,transform .25s}
#lyr p.cur{color:var(--ink);transform:scale(1.04);text-shadow:0 0 24px rgba(255,79,123,.55)}
#lyr p.past{color:rgba(246,235,223,.55)}
#lyr.plain p{color:var(--ink);font-size:clamp(20px,3vw,36px);font-weight:600}
.kbar{display:flex;justify-content:center;gap:14px;padding:10px 0 4px}
.kbar button{width:64px;height:64px;border-radius:50%;font-size:26px;padding:0}
.kbar button.pri{width:80px;height:80px;font-size:32px}
#ytwrap{position:relative;flex:1;display:none;background:#000}
#ytwrap.show{display:block}#ytwrap>div,#ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.srcsw{display:flex;gap:6px;margin-bottom:10px}
.srcsw button{flex:1;background:transparent;border:1px solid var(--line)}
.srcsw button.on{background:var(--ink);color:#1a0d14;border-color:var(--ink)}
.yt img{width:72px;height:52px;object-fit:cover;border-radius:8px}
.item.yt{grid-template-columns:72px minmax(0,1fr) auto}
h3{font-size:16px;margin:18px 0 6px;color:var(--acc2)}
label.chk{display:flex;gap:10px;align-items:center;min-height:44px}label.chk input{width:22px;min-height:22px}
.src{font-size:12px;color:var(--mute);text-align:center;padding:6px}
@media(prefers-reduced-motion:reduce){#lyr p{transition:none}}
</style>
</head>
<body>
<header>
  <h1>ROCOLA</h1>
  <nav id="nav" hidden>
    <a href="#buscar" data-v="buscar">Buscar</a>
    <a href="#lista" data-v="lista">Lista de espera</a>
    <a href="#karaoke" data-v="karaoke">Karaoke</a>
    <a href="#" id="navpop" title="Abre el karaoke en otra ventana que puedes llevar a otro monitor">Karaoke en ventana ↗</a>
    <a href="#ajustes" data-v="ajustes">Ajustes</a>
  </nav>
</header>

<main id="app"></main>

<div class="player" id="player" hidden>
  <div class="bar"><i id="pbar"></i></div>
  <div class="row" style="flex-wrap:nowrap;min-width:0">
    <img id="pimg" class="ph" alt="" style="width:44px;height:44px;border-radius:8px">
    <div style="min-width:0"><div class="t" id="ptitle">Nada sonando</div><div class="a" id="partist">Elige un tema</div></div>
  </div>
  <div class="row" style="flex-wrap:nowrap">
    <button class="icon ghost" id="bprev" aria-label="Anterior">⏮</button>
    <button class="icon pri" id="bplay" aria-label="Reproducir o pausar">▶</button>
    <button class="icon ghost" id="bnext" aria-label="Siguiente">⏭</button>
  </div>
</div>

<section id="karaoke" aria-label="Pantalla de karaoke">
  <div class="kh">
    <div style="min-width:0"><div class="t" id="kt">—</div><div class="a" id="ka"></div></div>
    <div class="ctr">
      <button class="ghost" id="kswap" title="Busca en Spotify una versión karaoke (sin voz) de este tema">Versión sin voz</button>
      <button class="ghost" id="kpop">Abrir en ventana aparte</button>
      <button class="ghost" id="kminus" title="Adelantar la letra">−0,5 s</button>
      <button class="ghost" id="kplus" title="Atrasar la letra">+0,5 s</button>
      <button class="ghost" id="kfull">Pantalla completa</button>
      <button id="kclose">Cerrar</button>
    </div>
  </div>
  <div id="lyr"></div>
  <div id="ytwrap"><div id="ytp"></div></div>
  <div class="kbar">
    <button class="ghost" id="kprev" aria-label="Anterior">⏮</button>
    <button class="pri" id="kplay" aria-label="Reproducir o pausar">▶</button>
    <button class="ghost" id="knext" aria-label="Siguiente">⏭</button>
  </div>
  <div class="src"><span id="ksrc"></span> · Rocola v6</div>
</section>

<div id="toast" role="status"></div>

<script>
{
const SCOPES='user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-modify-private playlist-modify-public';
const PL_NAME='Rocola · Lista de espera';
const REDIRECT=location.origin+location.pathname.replace(/index\.html$/,'');
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const app=$('app');
const S={src:LS.get('src')||'spotify',yres:[],mode:'todo',q:'',results:[],offset:0,queue:[],plId:LS.get('pl'),player:null,devices:[],device:LS.get('dev'),pollAt:0};

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500)}

/* ---------- Autenticación (PKCE, sin contraseñas en el código) ---------- */
const rand=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,b=>('0'+(b%36).toString(36)).slice(-1)).join('')};
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function login(){
  const cid=LS.get('cid');if(!cid){toast('Primero pega tu Client ID');return}
  const ver=rand(64),st=rand(16);LS.set('pkce',ver);LS.set('st',st);
  const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ver)));
  location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:cid,response_type:'code',redirect_uri:REDIRECT,code_challenge_method:'S256',code_challenge:ch,scope:SCOPES,state:st});
}
async function tokenReq(body){
  const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.error||'Error de autenticación');
  LS.set('at',j.access_token);LS.set('exp',String(Date.now()+(j.expires_in-60)*1000));if(j.refresh_token)LS.set('rt',j.refresh_token);
}
async function handleCallback(){
  const p=new URLSearchParams(location.search);
  if(p.get('error')){toast('Spotify rechazó el acceso: '+p.get('error'));history.replaceState(null,'',REDIRECT);return}
  if(!p.get('code'))return;
  if(p.get('state')!==LS.get('st')){toast('La respuesta de Spotify no coincide; vuelve a intentar');history.replaceState(null,'',REDIRECT);return}
  try{await tokenReq({grant_type:'authorization_code',code:p.get('code'),redirect_uri:REDIRECT,client_id:LS.get('cid'),code_verifier:LS.get('pkce')});toast('Conectado con Spotify')}
  catch(e){toast(e.message)}
  history.replaceState(null,'',REDIRECT+(location.hash||'#buscar'));
}
async function token(){
  if(LS.get('at')&&Date.now()<+LS.get('exp'))return LS.get('at');
  if(!LS.get('rt'))return null;
  /* Si otra ventana de la Rocola ya está renovando la sesión, espera y usa la suya */
  if(Date.now()-(+LS.get('lock')||0)<5000){await new Promise(r=>setTimeout(r,1500));if(LS.get('at')&&Date.now()<+LS.get('exp'))return LS.get('at')}
  LS.set('lock',String(Date.now()));
  await tokenReq({grant_type:'refresh_token',refresh_token:LS.get('rt'),client_id:LS.get('cid')});
  return LS.get('at');
}
function logout(){['at','rt','exp','pl'].forEach(LS.del);S.plId=null;route()}

/* ---------- API de Spotify ---------- */
async function api(path,opt={},retry=true){
  const t=await token();if(!t){route();throw new Error('Sesión cerrada')}
  const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+t,...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(r.status===401&&retry){LS.del('exp');return api(path,opt,false)}
  if(r.status===204||r.status===202)return null;
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null}catch(e){}
  if(!r.ok){
    const m=j?.error?.message||txt||('Error '+r.status);
    if(r.status===404&&/device/i.test(m))throw new Error('No hay un equipo activo: abre Spotify en la PC y reproduce cualquier tema una vez.');
    if(r.status===403)throw new Error('Spotify no permitió esta acción (403): '+m);
    if(r.status===429)throw new Error('Spotify pidió esperar un momento (demasiadas consultas).');
    throw new Error(m);
  }
  return j;
}
const devQ=()=>S.device?('?device_id='+encodeURIComponent(S.device)):'';

/* ---------- Lista de espera = una lista privada de Spotify ---------- */
async function ensurePlaylist(){
  if(S.plId)return S.plId;
  let url='/me/playlists?limit=50';
  for(let i=0;i<6&&url;i++){
    const j=await api(url);
    const f=(j.items||[]).find(p=>p&&p.name===PL_NAME);
    if(f){S.plId=f.id;LS.set('pl',f.id);return f.id}
    url=j.next?j.next.replace('https://api.spotify.com/v1',''):null;
  }
  const p=await api('/me/playlists',{method:'POST',body:JSON.stringify({name:PL_NAME,public:false,description:'Lista de espera de la Rocola'})});
  S.plId=p.id;LS.set('pl',p.id);return p.id;
}
async function loadQueue(){
  const id=await ensurePlaylist();const out=[];let url='/playlists/'+id+'/items?limit=50';
  for(let i=0;i<4&&url;i++){
    const j=await api(url);
    (j.items||[]).forEach(e=>{const tr=e.item||e.track;if(tr&&tr.uri)out.push(tr)});
    url=j.next?j.next.replace('https://api.spotify.com/v1',''):null;
  }
  S.queue=out;
}
async function addToQueue(tr,pos){
  const id=await ensurePlaylist();
  const body={uris:[tr.uri]};if(pos!=null)body.position=pos;
  await api('/playlists/'+id+'/items',{method:'POST',body:JSON.stringify(body)});
  await loadQueue();
}
async function moveItem(i,dir){
  const j=i+dir;if(j<0||j>=S.queue.length)return;
  await api('/playlists/'+S.plId+'/items',{method:'PUT',body:JSON.stringify({range_start:i,insert_before:dir>0?j+1:j,range_length:1})});
  await loadQueue();render();
}
async function removeItem(i){
  await api('/playlists/'+S.plId+'/items',{method:'DELETE',body:JSON.stringify({items:[{uri:S.queue[i].uri}]})});
  await loadQueue();render();
}
function curIndex(){
  const p=S.player;if(!p||!p.item||!p.context||!S.plId||!String(p.context.uri).endsWith(S.plId))return -1;
  return S.queue.findIndex(t=>t.uri===p.item.uri);
}
async function ensureDevice(force){
  if(S.device&&!force)return;
  await loadDevices();
  const d=S.devices.find(x=>x.is_active)||S.devices.find(x=>x.type==='Computer')||S.devices[0];
  if(!d){S.device=null;LS.del('dev');throw new Error('No encuentro ningún equipo con Spotify abierto. Abre la app de Spotify en la PC y vuelve a intentar.')}
  S.device=d.id;LS.set('dev',d.id);
}
async function withDevice(fn){
  await ensureDevice(false);
  try{return await fn()}
  catch(e){if(!/equipo activo/.test(e.message))throw e;await ensureDevice(true);return fn()}
}
async function playAt(i){
  await withDevice(()=>api('/me/player/play'+devQ(),{method:'PUT',body:JSON.stringify({context_uri:'spotify:playlist:'+S.plId,offset:{position:i}})}));
  setTimeout(poll,800);
}
async function playNow(tr){
  /* Toca el tema sin agregarlo a la lista de espera. Si ya hay algo cargado, lo pone
     en la cola interna de Spotify y salta a él: al terminar, sigue la lista donde iba. */
  await withDevice(async()=>{
    if(S.player&&S.player.item){
      await api('/me/player/queue?uri='+encodeURIComponent(tr.uri)+(S.device?'&device_id='+encodeURIComponent(S.device):''),{method:'POST'});
      await api('/me/player/next'+devQ(),{method:'POST'});
    }else await api('/me/player/play'+devQ(),{method:'PUT',body:JSON.stringify({uris:[tr.uri]})});
  });
  setTimeout(poll,800);toast('Sonando: '+tr.name);
}
async function clearPlayed(){
  const ci=curIndex();if(ci<=0){toast('No hay temas ya sonados para quitar');return}
  const uris=[...new Set(S.queue.slice(0,ci).map(t=>t.uri))].filter(u=>u!==S.queue[ci].uri);
  for(let k=0;k<uris.length;k+=100)await api('/playlists/'+S.plId+'/items',{method:'DELETE',body:JSON.stringify({items:uris.slice(k,k+100).map(uri=>({uri}))})});
  await loadQueue();render();toast('Lista limpia');
}

/* ---------- Búsqueda ---------- */
function buildQ(){
  const q=S.q.trim().replace(/"/g,'');if(!q)return '';
  return S.mode==='artista'?'artist:"'+q+'"':S.mode==='cancion'?'track:"'+q+'"':S.mode==='genero'?'genre:"'+q+'"':S.mode==='karaoke'?q+' karaoke':q;
}
async function search(more){
  const q=buildQ();if(!q)return;
  if(!more){S.offset=0;S.results=[]}
  const j=await api('/search?'+new URLSearchParams({q,type:'track',limit:'10',offset:String(S.offset)}));
  const items=(j.tracks&&j.tracks.items||[]).filter(Boolean);
  S.results=S.results.concat(items);S.offset+=10;S.hasMore=items.length===10&&S.offset<200;
  render();
}

/* ---------- Reproductor ---------- */
async function poll(){
  try{S.player=await api('/me/player');S.pollAt=performance.now()}catch(e){S.player=null}
  paintPlayer();
  if(view()==='lista')paintQueue();
}
async function loadDevices(){try{const j=await api('/me/player/devices');S.devices=j.devices||[]}catch(e){S.devices=[]}}
function paintPlayer(){
  const p=S.player,tr=p&&p.item;
  $('ptitle').textContent=tr?tr.name:'Nada sonando';
  $('partist').textContent=tr?tr.artists.map(a=>a.name).join(', ')+(p.device?' · en '+p.device.name:''):'Abre Spotify en la PC y elige un tema';
  const img=tr&&tr.album&&tr.album.images&&tr.album.images.at(-1);
  if(img)$('pimg').src=img.url;else $('pimg').removeAttribute('src');
  $('bplay').textContent=p&&p.is_playing?'⏸':'▶';
  $('pbar').style.width=tr?Math.min(100,(p.progress_ms/tr.duration_ms)*100)+'%':'0';
}
async function ctl(fn){try{await fn();setTimeout(poll,600)}catch(e){toast(e.message)}}
$('bplay').onclick=()=>ctl(()=>withDevice(()=>S.player&&S.player.is_playing?api('/me/player/pause'+devQ(),{method:'PUT'}):api('/me/player/play'+devQ(),{method:'PUT'})));
$('bnext').onclick=()=>ctl(()=>withDevice(()=>api('/me/player/next'+devQ(),{method:'POST'})));
$('bprev').onclick=()=>ctl(()=>withDevice(()=>api('/me/player/previous'+devQ(),{method:'POST'})));

/* ---------- Vistas ---------- */
const view=()=>{const v=(location.hash||'#buscar').slice(1);return v==='karaoke-ventana'?'karaoke':v};
function itemHTML(t,i,kind,cls=''){
  const img=t.album&&t.album.images&&t.album.images.at(-1);
  const acts=kind==='res'
    ?'<button class="pri" data-add="'+i+'" title="Agregar a la lista de espera" aria-label="Agregar a la lista">＋</button><button data-now="'+i+'" title="Tocar ahora" aria-label="Tocar ahora">▶</button>'
    :'<button data-play="'+i+'" aria-label="Tocar este">▶</button><button class="ghost" data-up="'+i+'" aria-label="Subir">↑</button><button class="ghost" data-down="'+i+'" aria-label="Bajar">↓</button><button class="ghost" data-del="'+i+'" aria-label="Quitar">✕</button>';
  return '<li class="item '+cls+'">'+(img?'<img src="'+esc(img.url)+'" alt="" loading="lazy">':'<div class="ph"></div>')+
    '<div style="min-width:0"'+(kind==='q'?' class="pick" data-play="'+i+'" role="button" tabindex="0" title="Tocar este tema"':'')+'><div class="t">'+esc(t.name)+'</div><div class="a">'+esc(t.artists.map(a=>a.name).join(', '))+' · '+esc(t.album?t.album.name:'')+'</div></div><div class="acts">'+acts+'</div></li>';
}
function searchHTML(){
  const modes=[['todo','Todo'],['artista','Artista'],['cancion','Canción'],['genero','Género'],['karaoke','Karaoke (sin voz)']];
 const sw='<div class="srcsw"><button data-src="spotify" class="'+(S.src==='spotify'?'on':'')+'">Spotify</button><button data-src="youtube" class="'+(S.src==='youtube'?'on':'')+'">YouTube karaoke</button></div>';
  if(S.src==='youtube')return ytSearchHTML(sw);

async function route(){
  const v=view();
  if(v==='karaoke'){openKaraoke();return}
  closeKaraoke(true);

  $('nav').hidden=!logged;$('player').hidden=!logged;
  if(!logged){app.innerHTML=setupHTML();return}
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v||(v==='lista'&&a.dataset.v==='lista')));

  render();

  const v=view();if(v==='ajustes'||v==='karaoke'||!LS.get('rt'))return;

  app.innerHTML=wide?'<div class="grid">'+searchHTML()+queueHTML()+'</div>':(v==='lista'?queueHTML():searchHTML());

/* ---------- Karaoke ---------- */
const K={id:null,lines:[],synced:false,off:+(LS.get('koff')||0),timer:null,cur:-1,cache:{}};
function clean(s){return String(s).replace(/\s*[-–]\s*(remaster|remasterizad|live|en vivo|version|versión|mono|stereo|radio edit|\d{4}).*$/i,'').replace(/\s*\((feat|with|con|remaster|live|en vivo)[^)]*\)/ig,'').trim()}
function parseLRC(txt){
  const out=[];txt.split(/\r?\n/).forEach(l=>{const ts=[...l.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];const text=l.replace(/\[[^\]]*\]/g,'').trim();ts.forEach(m=>out.push({t:+m[1]*60+ +m[2],text:text||'♪'}))});
  return out.sort((a,b)=>a.t-b.t);
}
const KRE=/karaoke|instrumental|sin voz|backing track/i;
function origin(tr){
  /* En las versiones karaoke el título suele decir quién la canta originalmente */
  const m=tr.name.match(/(?:originally performed by|in the style of|made famous by|popularized by|hecho famoso por|al estilo de|originalmente interpretad[oa] por)\s+([^\])]+)/i);
  const name=tr.name.replace(/\s*[\[(][^\])]*[\])]/g,'').replace(/\s*[-–].*$/,'').trim();
  return {name:name||tr.name,artist:m?m[1].trim():tr.artists[0].name};
}
async function fetchLyrics(tr){
  if(K.cache[tr.id])return K.cache[tr.id];
  const isK=KRE.test(tr.name)||KRE.test(tr.album?tr.album.name:'')||KRE.test(tr.artists.map(a=>a.name).join(' '));
  const o=isK?origin(tr):{name:tr.name,artist:tr.artists[0].name};
  const artist=o.artist,name=o.name;let res=null;
  if(!isK)try{const r=await fetch('https://lrclib.net/api/get?'+new URLSearchParams({artist_name:artist,track_name:name,album_name:tr.album?tr.album.name:'',duration:String(Math.round(tr.duration_ms/1000))}));if(r.ok)res=await r.json()}catch(e){}
  if(!res||(!res.syncedLyrics&&!res.plainLyrics)){
    try{const r=await fetch('https://lrclib.net/api/search?'+new URLSearchParams({track_name:clean(name),artist_name:artist}));
      if(r.ok){let arr=await r.json();
        if(!arr.length&&isK){const r2=await fetch('https://lrclib.net/api/search?'+new URLSearchParams({q:name}));if(r2.ok)arr=await r2.json()}const dur=tr.duration_ms/1000;arr.sort((a,b)=>Math.abs((a.duration||0)-dur)-Math.abs((b.duration||0)-dur));res=arr.find(x=>x.syncedLyrics)||arr.find(x=>x.plainLyrics)||null}}catch(e){}
  }
  K.cache[tr.id]=res||{};return K.cache[tr.id];
}
async function karaokeTick(){
  if(Y.active){const v=Y.state.q[Y.state.cur];$('kt').textContent=v?v.t:'';$('ka').textContent=v?('YouTube · '+v.c):'';$('kplay').textContent=Y.state.playing?'⏸':'▶';$('ksrc').textContent='Video de YouTube';return}
  const now=performance.now();
  if(now-S.pollAt>2500){try{S.player=await api('/me/player');S.pollAt=performance.now()}catch(e){}}
  const p=S.player,tr=p&&p.item;
  $('kplay').textContent=p&&p.is_playing?'⏸':'▶';
  if(!tr){$('kt').textContent='Nada sonando';$('ka').textContent='Elige un tema desde el celular';if(K.id){K.id=null;$('lyr').innerHTML=''}return}
  if(tr.id!==K.id){
    K.id=tr.id;K.cur=-1;$('kt').textContent=tr.name;$('ka').textContent=tr.artists.map(a=>a.name).join(', ');
    $('lyr').className='';$('lyr').innerHTML='<p class="cur">Buscando la letra…</p>';$('ksrc').textContent='';
    const L=await fetchLyrics(tr);if(K.id!==tr.id)return;
    if(L.syncedLyrics){K.synced=true;K.lines=parseLRC(L.syncedLyrics)}
    else if(L.plainLyrics){K.synced=false;K.lines=L.plainLyrics.split(/\r?\n/).map(t=>({t:0,text:t||' '}))}
    else{K.synced=false;K.lines=[]}
    $('lyr').className=K.synced?'':'plain';
    $('lyr').innerHTML=K.lines.length?K.lines.map(l=>'<p>'+esc(l.text)+'</p>').join(''):'<p class="cur">No se encontró la letra de este tema</p>';
    $('ksrc').textContent=K.lines.length?('Letra: LRCLIB (lrclib.net)'+(K.synced?' · sincronizada':' · sin sincronizar')):'';
  }
  if(!K.synced||!K.lines.length)return;
  const pos=(p.progress_ms+(p.is_playing?(performance.now()-S.pollAt):0))/1000+K.off;
  let i=-1;for(let k=0;k<K.lines.length;k++){if(K.lines[k].t<=pos)i=k;else break}
  if(i!==K.cur){
    K.cur=i;const ps=$('lyr').children;
    for(let k=0;k<ps.length;k++)ps[k].className=k===i?'cur':(k<i?'past':'');
    if(i>=0&&ps[i])ps[i].scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  }
}

    if(!k){toast('No encontré en Spotify una versión karaoke de este tema');return}
    await playNow(k);

};

/* ---------- Karaoke de YouTube ----------
   La PC que reproduce (con la pantalla de karaoke abierta) guarda la lista.
   El celular le manda órdenes por un canal privado de ntfy.sh (gratuito, sin cuenta). */
const NT='https://ntfy.sh/';
const WIN=rand(8);
const Y={key:LS.get('ytk')||'',topic:LS.get('topic')||'',plays:LS.get('yplays')!==null?LS.get('yplays')==='1':!matchMedia('(pointer:coarse)').matches,
  state:(()=>{try{return JSON.parse(LS.get('ystate'))||{q:[],cur:-1,playing:false}}catch(e){return {q:[],cur:-1,playing:false}}})(),
  es:null,engine:false,player:null,ready:false,active:false,seen:new Set(),pubT:null,gotState:false};
const phoneLink=()=>REDIRECT+'?'+new URLSearchParams({enlace:Y.topic,ytk:Y.key});
const dec=s=>{const t=document.createElement('textarea');t.innerHTML=s;return t.value};
const yitem=v=>({id:v.id,t:v.t.slice(0,80),c:v.c.slice(0,40),k:rand(6)});

function ytSearchHTML(sw){
  return '<section class="card"><h2>Buscar karaoke en YouTube</h2>'+sw+
  (!Y.key?'<p class="muted">Falta la clave de YouTube. Pégala en <a href="#ajustes" style="color:var(--acc2)">Ajustes</a>.</p>':'')+
  '<form id="sf" class="row" style="flex-wrap:nowrap"><input id="sq" type="search" placeholder="Tema o artista (se agrega «karaoke» sola)" value="'+esc(S.q)+'" autocomplete="off"><button class="pri">Buscar</button></form>'+
  (S.yres.length?'<ul class="list">'+S.yres.map((v,i)=>'<li class="item yt"><img src="https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/default.jpg" alt="" loading="lazy"><div style="min-width:0"><div class="t">'+esc(v.t)+'</div><div class="a">'+esc(v.c)+'</div></div><div class="acts"><button class="pri" data-yadd="'+i+'" aria-label="Agregar al karaoke">＋</button><button data-ynow="'+i+'" aria-label="Cantar ahora">▶</button></div></li>').join('')+'</ul>'+(S.ytok?'<p><button class="ghost" id="more">Ver más resultados</button></p>':'')
   :'<p class="muted">Cada búsqueda gasta 1 de las 100 búsquedas gratuitas por día; las repetidas no gastan.</p>')+'</section>';
}
async function ytSearch(more){
  if(!Y.key)throw new Error('Falta la clave de YouTube en Ajustes');
  const q=S.q.trim();if(!q)return;
  if(!more){S.yres=[];S.ytok=''}
  const ck='yts:'+q.toLowerCase()+':'+(more?S.ytok:'');
  let j=null;try{const c=JSON.parse(LS.get(ck));if(c&&Date.now()-c.at<864e5)j=c.j}catch(e){}
  if(!j){
    const r=await fetch('https://www.googleapis.com/youtube/v3/search?'+new URLSearchParams({part:'snippet',type:'video',videoEmbeddable:'true',maxResults:'10',q:q+' karaoke',key:Y.key,...(more&&S.ytok?{pageToken:S.ytok}:{})}));
    j=await r.json();
    if(!r.ok){const re=j.error&&j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason;
      throw new Error(re==='quotaExceeded'?'Se agotaron las búsquedas gratuitas de YouTube de hoy; mañana se renuevan.':'YouTube respondió: '+((j.error&&j.error.message)||r.status))}
    LS.set(ck,JSON.stringify({at:Date.now(),j}));
  }
  S.yres=S.yres.concat((j.items||[]).filter(x=>x.id&&x.id.videoId).map(x=>({id:x.id.videoId,t:dec(x.snippet.title),c:dec(x.snippet.channelTitle)})));
  S.ytok=j.nextPageToken||'';render();
}

/* Canal entre equipos */
async function ysend(m){
  if(!Y.topic)throw new Error('Configura el karaoke de YouTube en Ajustes');
  const r=await fetch(NT+encodeURIComponent(Y.topic),{method:'POST',body:JSON.stringify(m)});
  if(!r.ok)throw new Error('No se pudo enviar la orden ('+r.status+')');
}
function lockFree(){try{const l=JSON.parse(LS.get('ylock'));return !l||l.w===WIN||Date.now()-l.t>6000}catch(e){return true}}
function connect(){
  if(!Y.topic)return;
  const kOpen=$('karaoke').classList.contains('show');
  const eng=Y.plays&&kOpen&&lockFree();
  if(Y.es&&eng===Y.engine)return;
  if(Y.es)Y.es.close();
  Y.engine=eng;
  if(eng){
    LS.set('ylock',JSON.stringify({w:WIN,t:Date.now()}));
    clearInterval(connect.hb);connect.hb=setInterval(()=>{if(Y.engine)LS.set('ylock',JSON.stringify({w:WIN,t:Date.now()}))},2000);
    const last=LS.get('ylast');
    Y.es=new EventSource(NT+encodeURIComponent(Y.topic)+'/sse'+(last?'?since='+encodeURIComponent(last):''));
    loadYTApi();ypublish();
  }else{
    clearInterval(connect.hb);
    Y.es=new EventSource(NT+encodeURIComponent(Y.topic)+'/sse?since=2h');
  }
  Y.es.onmessage=ev=>{
    let d;try{d=JSON.parse(ev.data)}catch(e){return}
    if(d.event!=='message'||Y.seen.has(d.id))return;Y.seen.add(d.id);
    let m;try{m=JSON.parse(d.message)}catch(e){return}
    if(Y.engine){LS.set('ylast',d.id);if(m.t!=='state')yapply(m)}
    else if(m.t==='state'){Y.state=m.s;Y.gotState=true;paintYQueue()}
  };
  if(!eng)setTimeout(()=>{if(!Y.gotState)ysend({t:'hello'}).catch(()=>{})},1500);
}
function ypublish(){clearTimeout(Y.pubT);Y.pubT=setTimeout(()=>{
  try{LS.set('ystate',JSON.stringify(Y.state))}catch(e){}
  const st=Y.state;let q=st.q;
  /* el canal admite mensajes de hasta unos 4 KB: se envían como máximo 15 temas */
  const from=Math.max(0,Math.min(st.cur,q.length)-3);const s2={q:q.slice(from,from+15),cur:st.cur-from,playing:st.playing};
  ysend({t:'state',s:s2}).catch(()=>{});paintYQueue();
},300)}
function yfind(k){return Y.state.q.findIndex(v=>v.k===k)}
function yapply(m){
  const st=Y.state,q=st.q;
  if(m.t==='hello'){ypublish();return}
  if(m.t==='add'&&m.v){if(q.length<60)q.push(m.v)}
  else if(m.t==='now'&&m.v){const at=st.cur>=0&&st.cur<q.length?st.cur+1:q.length;q.splice(at,0,m.v);st.cur=at;yplay()}
  else if(m.t==='play'){const i=yfind(m.k);if(i>=0){st.cur=i;yplay()}}
  else if(m.t==='del'){const i=yfind(m.k);if(i>=0){q.splice(i,1);if(i<st.cur)st.cur--;else if(i===st.cur){yplay()}}}
  else if(m.t==='move'){const i=yfind(m.k),j=i+m.d;if(i>=0&&j>=0&&j<q.length){[q[i],q[j]]=[q[j],q[i]];if(st.cur===i)st.cur=j;else if(st.cur===j)st.cur=i}}
  else if(m.t==='clean'){if(st.cur>0){q.splice(0,st.cur);st.cur=0}}
  else if(m.t==='ctl'){
    if(m.c==='pause'&&Y.player&&Y.ready)Y.player.pauseVideo();
    else if(m.c==='play'){if(Y.active&&Y.player)Y.player.playVideo();else{if(st.cur<0||st.cur>=q.length)st.cur=0;yplay()}}
    else if(m.c==='next'){st.cur++;yplay()}
    else if(m.c==='prev'){st.cur=Math.max(0,st.cur-1);yplay()}
    else if(m.c==='stop'){yStopLocal();st.playing=false}
  }
  ypublish();
}
function loadYTApi(){
  if(window.YT&&window.YT.Player){ymake();return}
  if(loadYTApi.started)return;loadYTApi.started=true;
  window.onYouTubeIframeAPIReady=ymake;
  const sc=document.createElement('script');sc.src='https://www.youtube.com/iframe_api';document.head.appendChild(sc);
}
function ymake(){
  if(Y.player)return;
  Y.player=new window.YT.Player('ytp',{width:'100%',height:'100%',playerVars:{autoplay:1,rel:0,playsinline:1,origin:location.origin},
    events:{onReady:()=>{Y.ready=true;if(Y.pending){Y.pending=false;yplay()}},
      onStateChange:e=>{const S2=window.YT.PlayerState;
        if(e.data===S2.ENDED){Y.state.cur++;yplay();ypublish()}
        else if(e.data===S2.PLAYING){Y.state.playing=true;ypublish()}
        else if(e.data===S2.PAUSED){Y.state.playing=false;ypublish()}},
      onError:()=>{const v=Y.state.q[Y.state.cur];toast('Este video no se puede reproducir aquí'+(v?': '+v.t:'')+'. Paso al siguiente.');Y.state.cur++;yplay();ypublish()}}});
}
function yplay(){
  const st=Y.state,v=st.q[st.cur];
  if(!Y.engine)return;
  if(!v){yStopLocal();st.playing=false;if(st.cur>st.q.length)st.cur=st.q.length;return}
  if(!Y.ready){Y.pending=true;loadYTApi();return}
  if(S.player&&S.player.is_playing)api('/me/player/pause'+devQ(),{method:'PUT'}).catch(()=>{});
  Y.active=true;$('ytwrap').classList.add('show');$('lyr').style.display='none';
  Y.player.loadVideoById(v.id);st.playing=true;
}
function yStopLocal(){
  Y.active=false;$('ytwrap').classList.remove('show');$('lyr').style.display='';
  if(Y.player&&Y.ready)try{Y.player.stopVideo()}catch(e){}
  K.id=null;
}
function ytQueueHTML(){
  return '<section class="card" style="margin-bottom:22px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Karaoke YouTube</h2><div class="row">'+
  '<button class="icon ghost" data-yctl="prev" aria-label="Anterior">⏮</button><button class="icon pri" data-yctl="toggle" id="ytog" aria-label="Reproducir o pausar">▶</button><button class="icon ghost" data-yctl="next" aria-label="Siguiente">⏭</button>'+
  '<button class="ghost" data-yclean="1" id="yclean">Quitar los ya cantados</button></div></div><p class="muted" id="ystat"></p><ul class="list" id="ylist"></ul></section>';
}
function paintYQueue(){
  const ul=$('ylist');if(!ul)return;const st=Y.state;
  $('ytog').textContent=st.playing?'⏸':'▶';$('ytog').dataset.yctl=st.playing?'pause':'play';
  $('ystat').textContent=!Y.topic?'Configura el karaoke de YouTube en Ajustes.':(Y.engine||Y.gotState)?(st.playing?'Sonando en la PC.':'En pausa o detenido.'):'Esperando a la PC: abre allí la pantalla de karaoke.';
  ul.innerHTML=st.q.length?st.q.map((v,i)=>'<li class="item yt '+(i===st.cur?'now':(i<st.cur?'done':''))+'"><img src="https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/default.jpg" alt="" loading="lazy"><div style="min-width:0" class="pick" data-yplay="'+esc(v.k)+'" role="button" tabindex="0"><div class="t">'+esc(v.t)+'</div><div class="a">'+esc(v.c)+'</div></div><div class="acts"><button class="ghost" data-yup="'+esc(v.k)+'" aria-label="Subir">↑</button><button class="ghost" data-ydown="'+esc(v.k)+'" aria-label="Bajar">↓</button><button class="ghost" data-ydel="'+esc(v.k)+'" aria-label="Quitar">✕</button></div></li>').join('')
    :'<li class="muted" style="padding:12px 0">Sin temas de karaoke. Búscalos en «Buscar», opción «YouTube karaoke».</li>';
}

(async()=>{
  {const u=new URLSearchParams(location.search);
   if(u.get('enlace')){LS.set('topic',u.get('enlace'));Y.topic=u.get('enlace')}

  connect();
})();
}
